name: Update forecast and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # hourly: HRRR has a new run every hour (ready ~1.5 h after the run time); RRFS every 3 h,
    # ECMWF IFS/AIFS every 6 h (ready ~7-9 h after). Jobs with nothing new finish in about a minute.
    - cron: '20 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The bucket is the store: each job reads the published index.json to see which runs are
  # already there and only builds the missing ones.
  DATA_URL: https://pub-797c80c27d0f42d6ad578c6ed6044be2.r2.dev/
  R2_ACCOUNT_ID: 109b9e12fb8a09f6c53ab91bd3a5281e
  R2_BUCKET: ecmwf-wind-data

jobs:
  # one job per model, side by side; a failure in one model never blocks the others
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        model: [ifs, aifs, hrrr, rrfs]
    env:
      BUILD_BUDGET_MIN: '35'     # stop starting new runs after 35 min; the rest are built by the next job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Build missing runs (${{ matrix.model }})
        run: python update_data.py model ${{ matrix.model }}
      - name: Upload new runs to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p data
          du -sh data
          python r2_sync.py upload data
      - uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.model }}
          path: frag/${{ matrix.model }}.json
          retention-days: 1
          if-no-files-found: ignore

  # merge the model entries into index.json (a failed model keeps its previous entry),
  # upload it last, then delete runs that rolled off
  publish:
    needs: model
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-*
          path: frag
          merge-multiple: true
      - name: Publish index.json and clean up old runs
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ls frag || true
          python update_data.py publish
          python r2_sync.py publish data

  # the website itself (no forecast data inside) - only redeployed when the code changes
  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html config.js app.js draw.js style.css favicon.ico vendor _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
