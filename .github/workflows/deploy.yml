name: Update forecast and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # ECMWF open data for each run (00/06/12/18 UTC) appears ~7-9 h later
    - cron: '30 1,7,13,19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Check ecCodes
        run: python -c "import eccodes; print('ecCodes', eccodes.codes_get_api_version())"
      # Which runs should the site show? (5 newest complete IFS runs, 2 newest AIFS runs)
      - name: Plan runs
        id: plan
        run: python update_data.py plan
      # Each run, once built, is kept in the GitHub Actions cache, so later jobs only
      # download runs they have not seen before (and a failed job keeps finished runs).
      - uses: actions/cache/restore@v4
        id: r1
        with: { path: 'cache/${{ steps.plan.outputs.run1 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run1 }}' }
      - uses: actions/cache/restore@v4
        id: r2
        with: { path: 'cache/${{ steps.plan.outputs.run2 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run2 }}' }
      - uses: actions/cache/restore@v4
        id: r3
        with: { path: 'cache/${{ steps.plan.outputs.run3 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run3 }}' }
      - uses: actions/cache/restore@v4
        id: r4
        with: { path: 'cache/${{ steps.plan.outputs.run4 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run4 }}' }
      - uses: actions/cache/restore@v4
        id: r5
        with: { path: 'cache/${{ steps.plan.outputs.run5 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run5 }}' }
      # AIFS (AI model): the 2 newest runs, cached the same way (cache/aifs-<run id>)
      - uses: actions/cache/restore@v4
        id: a1
        with: { path: 'cache/${{ steps.plan.outputs.aifs1 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.aifs1 }}' }
      - uses: actions/cache/restore@v4
        id: a2
        with: { path: 'cache/${{ steps.plan.outputs.aifs2 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.aifs2 }}' }
      - name: Download new ECMWF runs and assemble site data
        env:
          RUNS: ${{ steps.plan.outputs.runs }}
          AIFS_RUNS: ${{ steps.plan.outputs.aifs_runs }}
        run: |
          for i in 1 2 3; do python update_data.py build && break; echo "retrying in 60s"; sleep 60; done
          test -f data/index.json
          du -sh data cache
      - uses: actions/cache/save@v4
        if: always() && steps.r1.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.run1 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.run1 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run1 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.r2.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.run2 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.run2 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run2 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.r3.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.run3 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.run3 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run3 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.r4.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.run4 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.run4 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run4 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.r5.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.run5 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.run5 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.run5 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.a1.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.aifs1 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.aifs1 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.aifs1 }}' }
      - uses: actions/cache/save@v4
        if: always() && steps.a2.outputs.cache-hit != 'true' && hashFiles('cache/${{ steps.plan.outputs.aifs2 }}/DONE') != ''
        with: { path: 'cache/${{ steps.plan.outputs.aifs2 }}', key: 'ecmwf-v3-${{ steps.plan.outputs.aifs2 }}' }
      # Forecast data lives in Cloudflare R2 (bucket ecmwf-wind-data), not in the Pages site.
      # r2_sync.py uploads only new/changed files, deletes runs that rolled off, and uploads
      # index.json last so visitors never see a half-uploaded run. If the R2 secrets are not
      # set yet, the data is published with the Pages site instead (old behaviour).
      - name: Upload data to Cloudflare R2
        id: upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: 109b9e12fb8a09f6c53ab91bd3a5281e
          R2_BUCKET: ecmwf-wind-data
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets not set - publishing data with the Pages site instead"
            echo "mode=pages" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install boto3
          python r2_sync.py data
          echo "mode=r2" >> "$GITHUB_OUTPUT"
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html config.js app.js draw.js style.css favicon.ico vendor _site/
          if [ "${{ steps.upload.outputs.mode }}" != "r2" ]; then
            cp -r data _site/
            echo "window.DATA_BASE = 'data/';" > _site/config.js
          fi
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
