<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
  <title>ECMWF Forecast Viewer</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-geoman.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="titlerow"><div class="title">ECMWF IFS forecast</div>
    <button id="settingsBtn" aria-expanded="false" aria-controls="settings" title="Settings">⚙ Settings ▾</button></div>
  <div class="row"><label for="runSel">Run</label><select id="runSel" title="Model run"></select></div>
  <div id="runinfo">Loading…</div>
  <div id="runNote"></div>
  <div id="validtime"></div>
  <div class="row">
    <button id="play" title="Play / pause">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1">
    <span id="stepLabel">+0h</span>
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="tParticles" checked> Particles</label>
    <label><input type="checkbox" id="tBarbs" checked> Barbs</label>
    <label><input type="checkbox" id="tIsobars"> Isobars (MSLP)</label>
  </div>
  <div class="row"><label for="shadeSel">Colours</label>
    <select id="shadeSel"><option value="speed">Wind speed</option><option value="gust">Wind gust</option>
      <option value="temp">Temperature (2 m)</option><option value="precip">Precipitation</option><option value="off">Off</option></select>
    <span class="pcpwrap"><select id="pcpSel" title="Precipitation period">
      <option value="1" disabled>1 h (not available: ECMWF free data is 3-hourly)</option>
      <option value="3">3 h total</option><option value="6">6 h total</option><option value="24">24 h total</option>
      <option value="total">Total since run start</option></select></span></div>
  <div id="shadeNote"></div>
  <div id="settings" hidden>
    <div class="srow"><label for="sUnits">Speed units</label>
      <select id="sUnits">
        <option value="kt">knots (kt)</option><option value="mph">mph</option>
        <option value="kmh">km/h</option><option value="ms">m/s</option>
      </select></div>
    <div class="srow"><label for="sTemp">Temperature</label>
      <select id="sTemp"><option value="F">°F</option><option value="C">°C</option></select></div>
    <div class="srow"><label for="sPrecip">Precipitation</label>
      <select id="sPrecip"><option value="in">inches (in)</option><option value="mm">millimetres (mm)</option></select></div>
    <div class="srow"><label for="sSpeed">Animation speed</label>
      <input type="range" id="sSpeed" min="0.05" max="1.5" step="0.05"><output id="oSpeed"></output></div>
    <div class="srow"><label for="sWidth">Line width</label>
      <input type="range" id="sWidth" min="0.5" max="4" step="0.25"><output id="oWidth"></output></div>
    <div class="srow"><label for="sTrail">Trail length</label>
      <input type="range" id="sTrail" min="1" max="10" step="1"><output id="oTrail"></output></div>
    <div class="srow"><label for="sDensity">Particle density</label>
      <input type="range" id="sDensity" min="0.25" max="3" step="0.25"><output id="oDensity"></output></div>
    <div class="srow"><span></span><button id="sReset">Reset to defaults</button></div>
    <div class="snote">Saved on this device. Wind barbs always use knots.</div>
  </div>
</div>

<div id="legend">
  <div class="ltitle" id="legendTitle">Wind speed (knots)</div>
  <canvas id="legendBar" width="260" height="14"></canvas>
  <div id="legendTicks"></div>
  <div class="ltitle" style="margin-top:8px">Barbs <span class="lnote">(always in knots)</span></div>
  <canvas id="barbKey" width="260" height="46"></canvas>
</div>

<div id="ams">
  <div id="amsBody" hidden>
    <div class="amsHead">Pinpoint readout</div>
    <label class="amsMaster"><input type="checkbox" id="hOn"> Show readout under the cursor</label>
    <div id="amsVars">
      <label class="amsAutoRow"><input type="checkbox" id="hAuto"> Match current layer <span class="lnote">(auto)</span></label>
      <div class="amsSub" id="amsSubVars">Show these values</div>
      <div class="amsGrid">
        <label><input type="checkbox" id="hSpeed"> Wind speed</label>
        <label><input type="checkbox" id="hDir"> Wind direction</label>
        <label><input type="checkbox" id="hGust"> Gust</label>
        <label><input type="checkbox" id="hTemp"> Temperature</label>
        <label><input type="checkbox" id="hPres"> Pressure</label>
        <label><input type="checkbox" id="hPcp"> Precipitation (selected period)</label>
        <label><input type="checkbox" id="hPcpTot"> Precip total since run start</label>
        <label><input type="checkbox" id="hCoord"> Coordinates</label>
      </div>
      <div class="amsSub">Style</div>
      <div class="amsStyle">
        <label><input type="radio" name="hStyle" id="hCompact" value="compact"> Compact</label>
        <label><input type="radio" name="hStyle" id="hDetailed" value="detailed"> Detailed <span class="lnote">(extra units, gust/precip period)</span></label>
      </div>
    </div>
    <div class="amsHead amsDrawHead">Drawing</div>
    <button id="openDraw" class="amsBig">✎ Drawing tools…</button>
    <div class="amsFoot"><button id="hReset">Reset these</button><span class="lnote">Saved on this device</span></div>
  </div>
  <button id="amsBtn" aria-expanded="false" aria-controls="amsBody">Additional Map Settings <span id="amsArrow">▴</span></button>
</div>

<div id="drawBar" hidden>
  <div class="dbHead"><b>Drawing tools</b><span id="dCount" class="lnote"></span><button id="dbClose" title="Close drawing tools">✕</button></div>
  <div class="dbTools">
    <button class="dt" data-t="select" aria-label="select"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 1l9 6.5-4 .8 2.4 4.6-1.6.8L6.4 9 3 12z" fill="#eee"/></svg></button>
    <button class="dt" data-t="pen" aria-label="pen">✎</button>
    <button class="dt" data-t="line" aria-label="line"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M3 13L21 3" stroke="#eee" stroke-width="2"/></svg></button>
    <button class="dt" data-t="arrow" aria-label="arrow"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M2 8H18" stroke="#eee" stroke-width="2"/><path d="M22 8l-6-4v8z" fill="#eee"/></svg></button>
    <button class="dt" data-t="rect" aria-label="rect"><svg viewBox="0 0 24 16" width="24" height="16"><rect x="4" y="2.5" width="16" height="11" fill="none" stroke="#eee" stroke-width="1.8"/></svg></button>
    <button class="dt" data-t="circle" aria-label="circle"><svg viewBox="0 0 24 16" width="24" height="16"><circle cx="12" cy="8" r="6" fill="none" stroke="#eee" stroke-width="1.8"/></svg></button>
    <button class="dt" data-t="polygon" aria-label="polygon"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M5 13l-2-7 8-4.5 9 4-3 7.5z" fill="none" stroke="#eee" stroke-width="1.8"/></svg></button>
    <button class="dt" data-t="text" aria-label="text"><b style="font-family:Georgia,serif;font-size:15px">T</b></button>
    <button class="dt" data-t="cold" aria-label="cold"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M1 12H23" stroke="#3d7bff" stroke-width="2"/><path d="M3 12l3.5-7 3.5 7zM14 12l3.5-7 3.5 7z" fill="#3d7bff"/></svg></button>
    <button class="dt" data-t="warm" aria-label="warm"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M1 12H23" stroke="#ff4040" stroke-width="2"/><path d="M3 12a3.5 3.5 0 0 1 7 0zM14 12a3.5 3.5 0 0 1 7 0z" fill="#ff4040"/></svg></button>
    <button class="dt" data-t="stat" aria-label="stat"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M1 8H12" stroke="#3d7bff" stroke-width="2"/><path d="M12 8H23" stroke="#ff4040" stroke-width="2"/><path d="M3 8l3.5-6.5 3.5 6.5z" fill="#3d7bff"/><path d="M14 8a3.5 3.5 0 0 0 7 0z" fill="#ff4040"/></svg></button>
    <button class="dt" data-t="occl" aria-label="occl"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M1 12H23" stroke="#b65cff" stroke-width="2"/><path d="M3 12l3.5-7 3.5 7zM14 12a3.5 3.5 0 0 1 7 0z" fill="#b65cff"/></svg></button>
    <button class="dt" data-t="trough" aria-label="trough"><svg viewBox="0 0 24 16" width="24" height="16"><path d="M1 8H23" stroke="#ffa53b" stroke-width="2.4" stroke-dasharray="5 3"/></svg></button>
    <button class="dt" data-t="H" aria-label="H"><b style="color:#3d8bff;font-size:15px">H</b></button>
    <button class="dt" data-t="L" aria-label="L"><b style="color:#ff4d4d;font-size:15px">L</b></button>
  </div>
  <div class="dbOpts">
    <label title="Colour (fronts use standard colours)"><input type="color" id="dColor"></label>
    <label class="dbW">Width <input type="range" id="dWidth" min="1" max="8" step="0.5"><output id="oWidthD"></output></label>
    <label title="Fill shapes"><input type="checkbox" id="dFill"> Fill</label>
    <input type="range" id="dOpac" min="0.05" max="1" step="0.05" title="Fill opacity">
    <button id="dFlip" title="Flip front symbols to the other side">⇅ Flip</button>
  </div>
  <div class="dbActs">
    <button id="dUndo" title="Undo (Ctrl+Z)">↶ Undo</button><button id="dRedo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <button id="dDel" title="Delete the selected drawing (Del)">🗑 Delete</button><button id="dFinish" hidden>✓ Finish</button>
    <button id="dVis" title="Show or hide all drawings">👁 Hide</button><button id="dClear" title="Delete all drawings">Clear all</button>
    <button id="dExport" title="Download drawings as GeoJSON">⤓ GeoJSON</button><button id="dImport" title="Load drawings from a GeoJSON file">⤒ Import</button>
    <button id="dPng" class="dbPrimary" title="Save the current map view with drawings as a PNG image">📷 Save image (PNG)</button>
  </div>
  <div id="dbHint"></div>
  <input type="file" id="dFile" accept=".geojson,.json,application/geo+json,application/json" hidden>
</div>

<div id="tooltip"></div>
<div id="loading">Loading forecast…</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-geoman.min.js"></script>
<script src="app.js"></script>
<script src="draw.js"></script>
</body>
</html>
