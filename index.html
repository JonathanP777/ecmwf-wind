<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
  <title>ECMWF Forecast Viewer</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div class="titlerow"><div class="title">ECMWF IFS forecast</div>
    <button id="settingsBtn" aria-expanded="false" aria-controls="settings" title="Settings">⚙ Settings ▾</button></div>
  <div class="row"><label for="runSel">Run</label><select id="runSel" title="Model run"></select></div>
  <div id="runinfo">Loading…</div>
  <div id="runNote"></div>
  <div id="validtime"></div>
  <div class="row">
    <button id="play" title="Play / pause">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1">
    <span id="stepLabel">+0h</span>
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="tParticles" checked> Particles</label>
    <label><input type="checkbox" id="tBarbs" checked> Barbs</label>
    <label><input type="checkbox" id="tIsobars"> Isobars (MSLP)</label>
  </div>
  <div class="row"><label for="shadeSel">Colours</label>
    <select id="shadeSel"><option value="speed">Wind speed</option><option value="gust">Wind gust</option>
      <option value="temp">Temperature (2 m)</option><option value="precip">Precipitation</option><option value="off">Off</option></select>
    <span class="pcpwrap"><select id="pcpSel" title="Precipitation period">
      <option value="1" disabled>1 h (not available: ECMWF free data is 3-hourly)</option>
      <option value="3">3 h total</option><option value="6">6 h total</option><option value="24">24 h total</option>
      <option value="total">Total since run start</option></select></span></div>
  <div id="shadeNote"></div>
  <div id="settings" hidden>
    <div class="srow"><label for="sUnits">Speed units</label>
      <select id="sUnits">
        <option value="kt">knots (kt)</option><option value="mph">mph</option>
        <option value="kmh">km/h</option><option value="ms">m/s</option>
      </select></div>
    <div class="srow"><label for="sTemp">Temperature</label>
      <select id="sTemp"><option value="F">°F</option><option value="C">°C</option></select></div>
    <div class="srow"><label for="sPrecip">Precipitation</label>
      <select id="sPrecip"><option value="in">inches (in)</option><option value="mm">millimetres (mm)</option></select></div>
    <div class="srow"><label for="sSpeed">Animation speed</label>
      <input type="range" id="sSpeed" min="0.05" max="1.5" step="0.05"><output id="oSpeed"></output></div>
    <div class="srow"><label for="sWidth">Line width</label>
      <input type="range" id="sWidth" min="0.5" max="4" step="0.25"><output id="oWidth"></output></div>
    <div class="srow"><label for="sTrail">Trail length</label>
      <input type="range" id="sTrail" min="1" max="10" step="1"><output id="oTrail"></output></div>
    <div class="srow"><label for="sDensity">Particle density</label>
      <input type="range" id="sDensity" min="0.25" max="3" step="0.25"><output id="oDensity"></output></div>
    <div class="srow"><span></span><button id="sReset">Reset to defaults</button></div>
    <div class="snote">Saved on this device. Wind barbs always use knots.</div>
  </div>
</div>

<div id="legend">
  <div class="ltitle" id="legendTitle">Wind speed (knots)</div>
  <canvas id="legendBar" width="260" height="14"></canvas>
  <div id="legendTicks"></div>
  <div class="ltitle" style="margin-top:8px">Barbs <span class="lnote">(always in knots)</span></div>
  <canvas id="barbKey" width="260" height="46"></canvas>
</div>

<div id="tooltip"></div>
<div id="loading">Loading forecast…</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
